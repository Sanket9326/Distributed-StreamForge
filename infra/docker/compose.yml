name: streamforge

services:
  web:
    build:
      context: ../../src/web
    ports:
      - "8080:8080"
      - "8443:8443"
      - "9443:9443"
    volumes:
      - ../../.certs:/etc/streamforge/tls:ro
    depends_on:
      gateway:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  gateway:
    entrypoint: ["/bin/sh", "/etc/streamforge/start.sh"]
    volumes:
      - gateway-keys:/home/app/.aspnet/DataProtection-Keys
      - ./gateway/start.sh:/etc/streamforge/start.sh:ro
    build:
      context: ../../src/backend/gateway
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Redis: redis:6379,password=${STREAMFORGE_REDIS_PASSWORD:?Set Redis password},abortConnect=false,connectTimeout=2000,asyncTimeout=2000
      DataProtection__KeysPath: /home/app/.aspnet/DataProtection-Keys
      ReverseProxy__Clusters__identity-cluster__Destinations__identity-service__Address: http://identity-service:8080/
      ReverseProxy__Clusters__upload-cluster__Destinations__upload-service__Address: http://upload-service:8080/
      ReverseProxy__Clusters__feed-cluster__Destinations__feed-service__Address: http://feed-service:8080/
      ReverseProxy__Clusters__playback-cluster__Destinations__playback-service__Address: http://playback-service:8080/
    expose:
      - "8080"
    depends_on:
      upload-service:
        condition: service_healthy
      feed-service:
        condition: service_healthy
      playback-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  identity-service:
    build:
      context: ../../src/backend/services/identity
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__IdentityDatabase: Host=postgres;Port=5432;Database=${STREAMFORGE_POSTGRES_DATABASE:?Copy .env.example to .env};Username=${STREAMFORGE_POSTGRES_USER:?Copy .env.example to .env};Password=${STREAMFORGE_POSTGRES_PASSWORD:?Copy .env.example to .env}
      ConnectionStrings__Redis: redis:6379,password=${STREAMFORGE_REDIS_PASSWORD:?Set Redis password},abortConnect=false,connectTimeout=2000,asyncTimeout=2000
    expose: ["8080"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:8.2.1-alpine
    environment:
      STREAMFORGE_REDIS_PASSWORD: ${STREAMFORGE_REDIS_PASSWORD:?Set Redis password}
    entrypoint: ["/bin/sh", "/etc/streamforge/start.sh"]
    volumes:
      - ./redis/start.sh:/etc/streamforge/start.sh:ro
    expose: ["6379"]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$STREAMFORGE_REDIS_PASSWORD redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  upload-service:
    build:
      context: ../../src/backend/services/upload
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__UploadDatabase: Host=postgres;Port=5432;Database=${STREAMFORGE_POSTGRES_DATABASE:?Copy .env.example to .env};Username=${STREAMFORGE_POSTGRES_USER:?Copy .env.example to .env};Password=${STREAMFORGE_POSTGRES_PASSWORD:?Copy .env.example to .env}
      Upload__MaxFileSizeBytes: "1073741824"
      ObjectStorage__Endpoint: minio:9000
      ObjectStorage__AccessKey: ${STREAMFORGE_MINIO_ACCESS_KEY:?Copy .env.example to .env}
      ObjectStorage__SecretKey: ${STREAMFORGE_MINIO_SECRET_KEY:?Copy .env.example to .env}
      ObjectStorage__Bucket: streamforge-videos
      ObjectStorage__UseSsl: "false"
      Kafka__BootstrapServers: kafka:9092
      Kafka__TopicName: video-processing
      Kafka__PartitionCount: "1"
      Kafka__ReplicationFactor: "1"
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  transcoding-service:
    build:
      context: ../../src/backend/workers/transcoding
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__TranscodingDatabase: Host=postgres;Port=5432;Database=${STREAMFORGE_POSTGRES_DATABASE:?Copy .env.example to .env};Username=${STREAMFORGE_POSTGRES_USER:?Copy .env.example to .env};Password=${STREAMFORGE_POSTGRES_PASSWORD:?Copy .env.example to .env}
      Kafka__BootstrapServers: kafka:9092
      Kafka__ConsumerGroupId: streamforge-transcoding-v1
      Kafka__InputTopic: video-processing
      Kafka__CompletedTopic: video-transcoding-completed
      Kafka__FailedTopic: video-transcoding-failed
      Kafka__DeadLetterTopic: video-processing-dead-letter
      Kafka__PartitionCount: "1"
      Kafka__ReplicationFactor: "1"
      ObjectStorage__Endpoint: minio:9000
      ObjectStorage__AccessKey: ${STREAMFORGE_MINIO_ACCESS_KEY:?Copy .env.example to .env}
      ObjectStorage__SecretKey: ${STREAMFORGE_MINIO_SECRET_KEY:?Copy .env.example to .env}
      ObjectStorage__RenditionsBucket: streamforge-renditions
      ObjectStorage__UseSsl: "false"
      Transcoding__MaxConcurrentJobs: "1"
      Transcoding__MaxAttempts: "5"
      Transcoding__ScratchPath: /tmp/streamforge-transcoding
    expose:
      - "8080"
    depends_on:
      upload-service:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  feed-service:
    build:
      context: ../../src/backend/services/feed
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__FeedDatabase: Host=postgres;Port=5432;Database=${STREAMFORGE_POSTGRES_DATABASE:?Copy .env.example to .env};Username=${STREAMFORGE_POSTGRES_USER:?Copy .env.example to .env};Password=${STREAMFORGE_POSTGRES_PASSWORD:?Copy .env.example to .env}
      Kafka__BootstrapServers: kafka:9092
      Kafka__ConsumerGroupId: streamforge-feed-v1
      Kafka__UploadedTopic: video-processing
      Kafka__CompletedTopic: video-transcoding-completed
      ObjectStorage__Endpoint: minio:9000
      ObjectStorage__PublicEndpoint: localhost:9443
      ObjectStorage__AccessKey: ${STREAMFORGE_MINIO_ACCESS_KEY:?Copy .env.example to .env}
      ObjectStorage__SecretKey: ${STREAMFORGE_MINIO_SECRET_KEY:?Copy .env.example to .env}
      ObjectStorage__RenditionsBucket: streamforge-renditions
      ObjectStorage__UseSsl: "false"
      ObjectStorage__PublicUseSsl: "true"
      ObjectStorage__SignedUrlExpirySeconds: "3600"
    expose:
      - "8080"
    depends_on:
      transcoding-service:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  playback-service:
    build:
      context: ../../src/backend/services/playback
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__PlaybackDatabase: Host=postgres;Port=5432;Database=${STREAMFORGE_POSTGRES_DATABASE:?Copy .env.example to .env};Username=${STREAMFORGE_POSTGRES_USER:?Copy .env.example to .env};Password=${STREAMFORGE_POSTGRES_PASSWORD:?Copy .env.example to .env}
      Kafka__BootstrapServers: kafka:9092
      Kafka__ConsumerGroupId: streamforge-playback-v1
      Kafka__CompletedTopic: video-transcoding-completed
      ObjectStorage__Endpoint: minio:9000
      ObjectStorage__PublicEndpoint: localhost:9443
      ObjectStorage__AccessKey: ${STREAMFORGE_MINIO_ACCESS_KEY:?Copy .env.example to .env}
      ObjectStorage__SecretKey: ${STREAMFORGE_MINIO_SECRET_KEY:?Copy .env.example to .env}
      ObjectStorage__RenditionsBucket: streamforge-renditions
      ObjectStorage__PublicUseSsl: "true"
      Playback__SignedUrlExpirySeconds: "3600"
    expose: ["8080"]
    depends_on:
      minio:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: ${STREAMFORGE_POSTGRES_DATABASE:?Copy .env.example to .env}
      POSTGRES_USER: ${STREAMFORGE_POSTGRES_USER:?Copy .env.example to .env}
      POSTGRES_PASSWORD: ${STREAMFORGE_POSTGRES_PASSWORD:?Copy .env.example to .env}
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:9.17
    environment:
      PGADMIN_DEFAULT_EMAIL: ${STREAMFORGE_PGADMIN_EMAIL:-admin@streamforge.dev}
      PGADMIN_DEFAULT_PASSWORD: ${STREAMFORGE_POSTGRES_PASSWORD:?Copy .env.example to .env}
    ports:
      - "5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  minio:
    build:
      context: ./minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${STREAMFORGE_MINIO_ACCESS_KEY:?Copy .env.example to .env}
      MINIO_ROOT_PASSWORD: ${STREAMFORGE_MINIO_SECRET_KEY:?Copy .env.example to .env}
      MINIO_API_CORS_ALLOW_ORIGIN: https://localhost:8443,https://localhost:4200
    expose:
      - "9000"
    ports:
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  kafka:
    image: apache/kafka:4.3.1
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_NUM_PARTITIONS: "1"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    expose:
      - "9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server 127.0.0.1:9092 --list >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

volumes:
  gateway-keys:
  postgres-data:
  pgadmin-data:
  minio-data:
  kafka-data:
