name: streamforge

services:
  web:
    build:
      context: ../../src/web
    ports:
      - "8080:8080"
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  gateway:
    build:
      context: ../../src/backend/gateway
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ReverseProxy__Clusters__upload-cluster__Destinations__upload-service__Address: http://upload-service:8080/
    expose:
      - "8080"
    depends_on:
      upload-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  upload-service:
    build:
      context: ../../src/backend/services/upload
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      UploadStorage__RootPath: /var/lib/streamforge/uploads
      UploadStorage__MaxFileSizeBytes: "1073741824"
    expose:
      - "8080"
    volumes:
      - upload-media:/var/lib/streamforge/uploads
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

volumes:
  upload-media:
