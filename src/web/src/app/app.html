<div class="app-shell">
  <header class="masthead">
    <a class="brand" routerLink="/" aria-label="StreamForge home">
      <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></span>
      <span>StreamForge</span>
    </a>

    <nav aria-label="Primary navigation">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
        Home
      </a>
      <a routerLink="/upload" routerLinkActive="active">Upload</a>
    </nav>

    <span class="environment"><i></i> Local</span>
  </header>

  <router-outlet />
</div>

@if (completions.toast(); as toast) {
  <aside class="completion-toast" role="status" aria-live="polite">
    <span class="toast-icon" aria-hidden="true">✓</span>
    <div>
      <strong>Your video is ready</strong>
      <p>{{ toast.title }} finished processing.</p>
      <a routerLink="/" (click)="completions.dismissToast()">View Home</a>
    </div>
    <button type="button" aria-label="Dismiss notification" (click)="completions.dismissToast()">
      ×
    </button>
  </aside>
}
