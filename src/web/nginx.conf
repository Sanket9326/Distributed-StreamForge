# Local ports need an HTTP redirect; production hostnames receive HSTS.
map $host $streamforge_hsts {
  default "max-age=31536000";
  localhost "";
  127.0.0.1 "";
}
server {
  listen 8080;
  server_name localhost;
  location = /health { access_log off; return 200 'healthy\n'; }
  location / { return 308 https://$host:8443$request_uri; }
}
server {
  listen 8443 ssl;
  server_name localhost;
  ssl_certificate /etc/streamforge/tls/localhost.pem;
  ssl_certificate_key /etc/streamforge/tls/localhost.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  add_header Strict-Transport-Security $streamforge_hsts always;
  add_header X-Content-Type-Options nosniff always;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 1025m;
  location /api/ {
    proxy_pass http://gateway:8080;
    proxy_http_version 1.1;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location / { try_files $uri $uri/ /index.html; }
}
# Preserve the original host, path and signed query string for S3 verification.
server {
  listen 9443 ssl;
  server_name localhost;
  ssl_certificate /etc/streamforge/tls/localhost.pem;
  ssl_certificate_key /etc/streamforge/tls/localhost.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  add_header Strict-Transport-Security $streamforge_hsts always;
  location / {
    limit_except GET HEAD OPTIONS { deny all; }
    proxy_pass http://minio:9000;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Cookie '';
    proxy_set_header Authorization '';
    proxy_buffering off;
  }
}
